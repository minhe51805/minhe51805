name: Update README

on:
  # Refresh the projects table and the "last updated" stamp every day.
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  # Allow a manual run from the Actions tab.
  workflow_dispatch:
  # Keep the table in sync as soon as the profile README changes.
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/update_readme.py"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          README_USERNAME: minhe51805
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): auto-update projects table [skip ci]"
          git push
